---
name: Build SteadDesk
'on':
  pull_request:
  push:
    tags: ['v1.5.0-sd.*']
  workflow_dispatch:
permissions:
  contents: read
env:
  STEADDESK_SUPPORT_PHONE: ${{ vars.STEADDESK_SUPPORT_PHONE }}
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: 3.1.2
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  VERSION: 1.5.0
  NDK_VERSION: r28c
  CARGO_EXPAND_VERSION: 1.0.95
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Validate distribution version and tag
      shell: bash
      run: |
        version=$(cat RELEASE_VERSION)
        [[ $version =~ ^1\.5\.0-sd\.[1-9][0-9]*$ ]]
        if [[ $GITHUB_REF_TYPE == tag ]]; then
          test "$GITHUB_REF_NAME" = "v$version"
        fi
    - name: Test release packaging and signing handoff without credentials
      run: python3 -B -m unittest discover -s scripts/tests -v
    - name: Scan the distribution repository history
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
        tar xf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  bridge:
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
          extra-build-args: ''
          flutter-version: 3.22.3
          artifact-name: bridge-artifact
    steps:
    - name: Checkout pinned RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        submodules: recursive
        persist-credentials: false
    - name: Checkout distribution queue
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: ".distribution"
        persist-credentials: false
    - name: Apply distribution patches and assets
      shell: bash
      run: bash .distribution/scripts/apply-patches.sh "$GITHUB_WORKSPACE"
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.RUST_VERSION }}"
        targets: "${{ matrix.job.target }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: bridge-${{ matrix.job.os }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ matrix.job.flutter-version }}"
        cache: true
    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        pushd flutter && flutter pub get && popd
    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ matrix.job.artifact-name }}"
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
        retention-days: 1
  android-native:
    needs:
    - bridge
    name: Android native ${{ matrix.job.arch }}
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
             clang \
             cmake \
             curl \
             gcc-multilib \
             git \
             g++ \
             g++-multilib \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libc6-dev \
             libclang-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-dev \
             nasm \
             ninja-build \
             openjdk-17-jdk-headless \
             pkg-config \
             tree \
             wget
    - name: Checkout pinned RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        submodules: recursive
        persist-credentials: false
    - name: Checkout distribution queue
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: ".distribution"
        persist-credentials: false
    - name: Apply distribution patches and assets
      shell: bash
      run: bash .distribution/scripts/apply-patches.sh "$GITHUB_WORKSPACE"
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.ANDROID_FLUTTER_VERSION }}"
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with: &1
        ndk-version: "${{ env.NDK_VERSION }}"
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: "/opt/artifacts/vcpkg"
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            ANDROID_TARGET=arm64-v8a
          ;;
          armv7-linux-androideabi)
            ANDROID_TARGET=armeabi-v7a
          ;;
          x86_64-linux-android)
            ANDROID_TARGET=x86_64
          ;;
          i686-linux-android)
            ANDROID_TARGET=x86
          ;;
        esac
        if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: "./"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.RUST_VERSION }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: "${{ matrix.job.target }}"
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: "${{ steps.setup-ndk.outputs.ndk-path }}"
        ANDROID_NDK_ROOT: "${{ steps.setup-ndk.outputs.ndk-path }}"
      run: |
        rustup target add ${{ matrix.job.target }}
        cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            ./flutter/ndk_arm64.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          ;;
          armv7-linux-androideabi)
            ./flutter/ndk_arm.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          ;;
          x86_64-linux-android)
            ./flutter/ndk_x64.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
          ;;
          i686-linux-android)
            ./flutter/ndk_x86.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
          ;;
        esac
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: "./target/${{ matrix.job.target }}/release/liblibrustdesk.so"
        retention-days: 1
  android:
    needs:
    - android-native
    name: Android universal APK
    runs-on: ubuntu-24.04
    env:
      reltype: release
      x86_target: ''
      suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
             clang \
             cmake \
             curl \
             gcc-multilib \
             git \
             g++ \
             g++-multilib \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libc6-dev \
             libclang-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-dev \
             nasm \
             ninja-build \
             openjdk-17-jdk-headless \
             pkg-config \
             tree \
             wget
    - name: Checkout pinned RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        submodules: recursive
        persist-credentials: false
    - name: Checkout distribution queue
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: ".distribution"
        persist-credentials: false
    - name: Apply distribution patches and assets
      shell: bash
      run: bash .distribution/scripts/apply-patches.sh "$GITHUB_WORKSPACE"
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.ANDROID_FLUTTER_VERSION }}"
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: "./"
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.aarch64-linux-android
        path: "./flutter/android/app/src/main/jniLibs/arm64-v8a"
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.armv7-linux-androideabi
        path: "./flutter/android/app/src/main/jniLibs/armeabi-v7a"
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.x86_64-linux-android
        path: "./flutter/android/app/src/main/jniLibs/x86_64"
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with: *1
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
        ANDROID_NDK_HOME: "${{ steps.setup-ndk.outputs.ndk-path }}"
      run: |
        export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
        # Increase Gradle JVM memory for CI builds
        sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
        mv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
        mv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
        mv ./flutter/android/app/src/main/jniLibs/x86_64/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
        # build flutter
        pushd flutter
        flutter build apk "--${{ env.reltype }}" --target-platform android-arm64,android-arm,android-x64${{ env.x86_target }}
        popd
        mkdir -p dist
        version=$(cat .distribution/RELEASE_VERSION)
        apk="dist/SteadDesk-$version-universal.apk"
        cp flutter/build/app/outputs/flutter-apk/app-release.apk "$apk"
        build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
        "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
        grep -F "package: name='com.steaddesk.remote'" "$RUNNER_TEMP/badging" | grep -F "versionName='$version'"
        unzip -tq "$apk"
        "$build_tools/apksigner" version
        python3 - "$apk" <<'PYTHON'
        import re, sys, zipfile
        with open(sys.argv[1], "rb") as stream, zipfile.ZipFile(stream) as archive:
            if any(re.fullmatch(r"META-INF/(?:[^/]+\.(?:SF|RSA|DSA|EC)|SIG-[^/]+)", name, re.I)
                   for name in archive.namelist()):
                raise SystemExit("Unexpected JAR signature in unsigned APK")
            stream.seek(archive.start_dir - 16)
            if stream.read(16) == b"APK Sig Block 42":
                raise SystemExit("Unexpected APK signing block")
        PYTHON
        if "$build_tools/apksigner" verify "$apk"; then
          echo "Expected an unsigned APK" >&2
          exit 1
        fi
        cd dist && sha256sum *.apk > SHA256SUMS
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: SteadDesk-Android-universal
        path: dist
        if-no-files-found: error
  windows:
    name: Windows x64 ${{ matrix.edition }}
    env:
      STEADDESK_EDITION: ${{ matrix.edition }}
    needs:
    - bridge
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        edition: [merchant, support]
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: "--vram"
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout pinned RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        submodules: recursive
        persist-credentials: false
    - name: Checkout distribution queue
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: ".distribution"
        persist-credentials: false
    - name: Apply distribution patches and assets
      shell: bash
      run: bash .distribution/scripts/apply-patches.sh "$GITHUB_WORKSPACE"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: "./"
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: "${{ env.LLVM_VERSION }}"
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: "${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION
          || env.FLUTTER_VERSION }}"
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        if ((Get-FileHash -Algorithm SHA256 windows-x64-release.zip).Hash -ne 'ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e') {
          throw 'Custom Flutter engine ZIP checksum mismatch'
        }
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.SCITER_RUST_VERSION }}"
        targets: "${{ matrix.job.target }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: "${{ matrix.job.os }}"
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: "${{ matrix.job.vcpkg-triplet }}"
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - name: Build rustdesk
      run: |+
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi
    - name: Build self-extracted executable
      shell: bash
      run: |
        sed -i '/dpiAware/d' res/manifest.xml
        product=SteadDesk
        if [[ "$STEADDESK_EDITION" == support ]]; then product="SteadDesk Support"; fi
        mv rustdesk/rustdesk.exe "rustdesk/$product.exe"
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/$product.exe"
        popd
        mkdir -p dist
        version=$(cat .distribution/RELEASE_VERSION)
        mv target/release/rustdesk-portable-packer.exe "dist/${product// /}-$version-x64.exe"
        cd dist && sha256sum *.exe > SHA256SUMS
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: SteadDesk-Windows-x64-${{ matrix.edition }}
        path: dist
        if-no-files-found: error
  windows-smoke:
    name: Offline Windows UI ${{ matrix.edition }}
    strategy:
      matrix:
        edition: [merchant, support]
    env:
      STEADDESK_EDITION: ${{ matrix.edition }}
    needs: windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: SteadDesk-Windows-x64-${{ matrix.edition }}
        path: package
    - name: Prepare UI automation
      run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0
    - name: Verify offline interface on the packaged client
      shell: pwsh
      run: |
        . ./scripts/windows-isolate.ps1
        python scripts/windows-smoke.py $package screenshots
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Windows-UI-evidence-${{ matrix.edition }}
        path: screenshots/*.png
        if-no-files-found: error

  windows-password:
    name: Installed Windows password CLI
    needs: windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: SteadDesk-Windows-x64-merchant
        path: package
    - name: Verify installed service and password command line
      shell: pwsh
      run: |
        . ./scripts/windows-isolate.ps1
        & ./scripts/windows-password-smoke.ps1 -Package $package

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: SteadDesk-Windows-x64-support
        path: support-package
    - name: Verify the support installation alongside the merchant service
      shell: pwsh
      env:
        STEADDESK_EDITION: support
      run: |
        . ./scripts/windows-isolate.ps1 -PackageDir support-package
        $null = Start-Process -PassThru -FilePath $package -ArgumentList '--silent-install'
        $deadline = [datetime]::UtcNow.AddMinutes(2)
        do {
          $svc = Get-CimInstance Win32_Service -Filter "Name='SteadDesk Support'"
          if ($svc.State -eq 'Running') { break }
          Start-Sleep -Seconds 1
        } while ([datetime]::UtcNow -lt $deadline)
        $installed = Join-Path $env:ProgramFiles 'SteadDesk Support' 'SteadDesk Support.exe'
        if (-not $svc) { throw "Support service was not registered. Installed EXE present: $(Test-Path -LiteralPath $installed)" }
        if ($svc.State -ne 'Running') { throw "Support service state: $($svc.State), exit code: $($svc.ExitCode)" }
        if ($svc.PathName -ine ('"' + $installed + '" --service')) { throw "Unexpected support service ImagePath: $($svc.PathName)" }
        if ((Get-Service -Name SteadDesk).Status -ne 'Running') { throw 'Merchant service was replaced' }
        if ((Get-Item $installed).VersionInfo.ProductName -cne 'SteadDesk Support') { throw 'Installed support identity mismatch' }
        if ((& $installed --option approve-mode | Out-String).Trim() -cne 'click') { throw 'Support approval is not click-only' }
        if ((& $installed --option allow-support-incoming | Out-String).Trim() -ceq 'Y') { throw 'Support unexpectedly allows incoming requests' }

  source:
    name: Corresponding source
    needs: audit
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        persist-credentials: false
    - name: Archive the patched distribution
      run: |
        version=$(cat RELEASE_VERSION)
        python3 scripts/archive-source.py "$RUNNER_TEMP/SteadDesk-$version-source.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: SteadDesk-source
        path: ${{ runner.temp }}/SteadDesk-*-source.tar.gz
        if-no-files-found: error

  bundle:
    name: Assemble unsigned release
    needs: [source, android, windows-smoke, windows-password]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.assemble.outputs.version }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: SteadDesk-*
        path: artifacts
    - id: assemble
      shell: bash
      run: |
        version=$(cat RELEASE_VERSION)
        (cd artifacts/SteadDesk-Windows-x64-merchant && sha256sum --strict -c SHA256SUMS)
        (cd artifacts/SteadDesk-Android-universal && sha256sum --strict -c SHA256SUMS)
        (cd artifacts/SteadDesk-Windows-x64-support && sha256sum --strict -c SHA256SUMS)
        for dir in artifacts/SteadDesk-Windows-x64-{merchant,support} artifacts/SteadDesk-Android-universal; do
          cat "$dir/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
        done
        mkdir dist
        cp "artifacts/SteadDesk-Windows-x64-merchant/SteadDesk-$version-x64.exe" "dist/SteadDesk-$version-x64.unsigned.exe"
        cp "artifacts/SteadDesk-Android-universal/SteadDesk-$version-universal.apk" "dist/SteadDesk-$version-universal.unsigned.apk"
        cp "artifacts/SteadDesk-source/SteadDesk-$version-source.tar.gz" dist/
        (cd dist && sha256sum SteadDesk-* > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Unsigned-release
        path: dist
        if-no-files-found: error

  draft:
    name: Create draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: Unsigned-release
        path: dist
    - name: Upload unsigned assets to a new draft
      working-directory: dist
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.bundle.outputs.version }}
      run: |
        test "$GITHUB_REF_NAME" = "v$VERSION"
        sha256sum --strict -c SHA256SUMS
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          --verify-tag --draft --title "SteadDesk $VERSION" \
          --notes 'Unsigned build for offline signing and review.' \
          "SteadDesk-$VERSION-x64.unsigned.exe" "SteadDesk-$VERSION-universal.unsigned.apk" \
          "SteadDesk-$VERSION-source.tar.gz" SHA256SUMS
