name: FIX-2 existing Windows package replay
'on': workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  support:
    name: Offline support UI on original package (Today ${{ matrix.today }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - today: 'true'
            run: '43769130431'
            artifact: '14184977544'
            sha256: '0e89c25812c3a6ca8102cc3a715fd13dd5797bc2accc132986c670002cb6b006'
          - today: 'false'
            run: '43775320685'
            artifact: '14187487042'
            sha256: 'aa4c5e944a7726162dd5de91befe8eb5d8f99ccfa0799ab7baf4be5962c3ba33'
    env:
      STEADDESK_EDITION: support
      STEADDESK_TODAY: ${{ matrix.today }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: '73625a6f2fcc29fd1bff41c281bf93a1c3f81072'
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.artifact }}
          merge-multiple: true
          path: package
      - name: Prepare UI automation
        run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0
      - name: Verify the original unsigned package and run the offline interface checks
        shell: pwsh
        env:
          EXPECT_RUN: ${{ matrix.run }}
          EXPECT_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content package/ops-test-profile.json -Raw | ConvertFrom-Json
          if ($source.run -cne $env:EXPECT_RUN -or $source.sha256 -cne $env:EXPECT_SHA256 -or $source.commit -cne '15d1504e77a45159ffa196a1f0d96310eac367a1') { throw 'Unexpected original build receipt' }
          . ./scripts/windows-isolate.ps1
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash -ine $env:EXPECT_SHA256) { throw 'Unexpected original support binary' }
          Write-Host "Verified package run $env:EXPECT_RUN SHA256 $env:EXPECT_SHA256 Today=$env:STEADDESK_TODAY"
          python -X utf8 scripts/windows-smoke.py $package screenshots
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: FIX-2-offline-support-${{ matrix.run }}
          path: screenshots/*.png
          if-no-files-found: error
