---
name: Verify offline capture on archived Windows build
'on':
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: 3.1.2
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  VERSION: 1.5.0
  NDK_VERSION: r28c
  CARGO_EXPAND_VERSION: 1.0.95
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Scan the distribution repository history
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
        tar xf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  windows-smoke:
    name: Offline Windows UI
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: SteadDesk-Windows-x64
        run-id: 42438211858
        github-token: "${{ github.token }}"
        path: package
    - name: Prepare UI automation
      run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0
    - name: Isolate both service names and executables before launch
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $names = 'relay.steaddesk.com','api.steaddesk.com'
        $hostsFile = "$env:WINDIR\System32\drivers\etc\hosts"
        foreach ($name in $names) {
          Add-Content -Path $hostsFile -Value "`n127.0.0.1 $name`n::1 $name" -Encoding ascii
        }
        Clear-DnsClientCache
        foreach ($name in $names) {
          foreach ($ip in [Net.Dns]::GetHostAddresses($name)) {
            if (![Net.IPAddress]::IsLoopback($ip)) { throw 'Service name is not isolated' }
          }
        }
        $package = (Resolve-Path package/SteadDesk-1.5.0-x64.exe).Path
        $expected = ((Get-Content package/SHA256SUMS) -split '\s+')[0]
        if ((Get-FileHash $package).Hash -ne $expected) { throw 'Package checksum mismatch' }
        foreach ($binary in @($package, "$env:LOCALAPPDATA\rustdesk\rustdesk.exe")) {
          New-NetFirewallRule -DisplayName "Offline UI $binary" -Program $binary -Direction Outbound -Action Block | Out-Null
        }
        python scripts/windows-smoke.py $package screenshots
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Windows-UI-evidence
        path: screenshots/*.png
        if-no-files-found: error
