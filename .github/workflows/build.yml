---
name: Build SteadDesk demo
'on':
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: 3.1.2
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  VERSION: 1.5.0
  NDK_VERSION: r28c
  CARGO_EXPAND_VERSION: 1.0.95
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
jobs:
  windows-password:
    name: Installed Windows password CLI
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: SteadDesk-Windows-x64
        run-id: 42454028607
        github-token: "${{ github.token }}"
        path: package
    - name: Verify installed service and password command line
      shell: pwsh
      run: |
        . ./scripts/windows-isolate.ps1
        Start-Process -Wait -FilePath $package -ArgumentList '--version'
        $payload = "$env:LOCALAPPDATA\rustdesk\rustdesk.exe"
        $renamed = "$env:LOCALAPPDATA\rustdesk\SteadDesk.exe"
        if (!(Test-Path -LiteralPath $payload)) { throw 'Archived payload missing' }
        Move-Item -LiteralPath $payload -Destination $renamed
        & ./scripts/windows-password-smoke.ps1 -Package $renamed
