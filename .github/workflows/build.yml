name: Verify the sd.5 packaged support UI
'on': workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  support:
    if: github.ref == 'refs/heads/codex/p31-sd5-ui-validation'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      STEADDESK_EDITION: support
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '44202757962'
        github-token: ${{ github.token }}
        name: SteadDesk-Windows-x64-support
        path: package
    - name: Pin the original package
      shell: pwsh
      run: |
        $p = 'package/SteadDeskSupport-1.5.0-sd.5-x64.exe'
        if ((Get-FileHash $p).Hash -ne 'f4d47601a55263b7399ca6b74e3336741dc3f199aebe1c398f2d19e1c1d4cd50') {
          throw 'Package differs from the original run'
        }
    - name: Prepare UI automation
      run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0
    - name: Verify offline interface on the original packaged client
      shell: pwsh
      run: |
        . ./scripts/windows-isolate.ps1
        python scripts/windows-smoke.py $package screenshots
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Windows-UI-evidence-support
        path: screenshots/*.png
        if-no-files-found: error
